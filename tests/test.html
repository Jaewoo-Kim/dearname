<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>DearName 만세력 엔진 테스트</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif; background: #f8fafc; color: #1e293b; padding: 24px; }
  h1 { font-size: 1.2rem; font-weight: 800; margin-bottom: 4px; }
  .subtitle { font-size: 0.8rem; color: #64748b; margin-bottom: 24px; }
  #summary { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
  .badge { padding: 8px 18px; border-radius: 20px; font-size: 0.85rem; font-weight: 700; }
  .badge.total  { background:#e2e8f0; color:#334155; }
  .badge.pass   { background:#dcfce7; color:#16a34a; }
  .badge.fail   { background:#fee2e2; color:#dc2626; }
  #btn-run { padding: 8px 20px; border-radius: 8px; border: none; background: #1e293b; color: white;
             font-size: 0.85rem; font-weight: 700; cursor: pointer; margin-bottom: 24px; }
  #btn-run:hover { background: #334155; }
  .suite { margin-bottom: 20px; }
  .suite-name { font-size: 0.78rem; font-weight: 700; color: #475569; letter-spacing: 0.5px;
                text-transform: uppercase; margin-bottom: 6px; padding-left: 4px; border-left: 3px solid #cbd5e1; }
  .case { display: flex; align-items: flex-start; gap: 8px; padding: 5px 8px; border-radius: 6px;
          font-size: 0.82rem; line-height: 1.5; }
  .case.pass  { background: #f0fdf4; }
  .case.fail  { background: #fef2f2; }
  .icon { font-size: 0.9rem; flex-shrink: 0; margin-top: 1px; }
  .msg  { color: #334155; }
  .fail .msg  { color: #991b1b; }
  .detail { font-size: 0.75rem; color: #94a3b8; margin-left: 4px; }
  .fail .detail { color: #f87171; }
</style>
</head>
<body>

<h1>🧪 DearName 만세력 엔진 테스트</h1>
<p class="subtitle">runner.js 와 동일한 suite 파일(shared/self/premium) — 브라우저에서 직접 실행</p>
<button id="btn-run">▶ 테스트 실행</button>
<div id="summary" style="display:none"></div>
<div id="output"></div>

<!-- 엔진 의존성 -->
<script src="../data/manjuryeok.js"></script>
<script src="../data/lunar-calendar.js"></script>
<script src="../lib/saju-engine.js"></script>
<script src="../lib/name-spec.js"></script>

<!-- 테스트 프레임워크 + 헬퍼 -->
<script src="framework.js"></script>
<script src="helpers.js"></script>

<!-- suite 파일 (제품 경계별 — runner.js 와 동일 목록) -->
<script src="suites/shared/saju.test.js"></script>
<script src="suites/self/oheng-count.test.js"></script>
<script src="suites/self/saju-grade.test.js"></script>
<script src="suites/premium/oheng-weighted.test.js"></script>
<script src="suites/premium/saju-grade-prem.test.js"></script>
<script src="suites/premium/namespec.test.js"></script>

<!-- 렌더링 -->
<script>
document.getElementById('btn-run').addEventListener('click', runAndRender);
function runAndRender() {
  let totalPass = 0, totalFail = 0;
  const out = document.getElementById('output');
  out.innerHTML = '';
  __TEST_SUITES__.forEach(s => {
    const div = document.createElement('div');
    div.className = 'suite';
    div.innerHTML = `<div class="suite-name">${s.name}</div>`;
    s.cases.forEach(c => {
      if (c.ok) totalPass++; else totalFail++;
      const item = document.createElement('div');
      item.className = 'case ' + (c.ok ? 'pass' : 'fail');
      item.innerHTML = `<span class="icon">${c.ok ? '✓' : '✗'}</span>
        <span class="msg">${c.msg}${c.detail ? `<span class="detail"> — ${c.detail}</span>` : ''}</span>`;
      div.appendChild(item);
    });
    out.appendChild(div);
  });
  const sum = document.getElementById('summary');
  sum.style.display = 'flex';
  sum.innerHTML = `
    <span class="badge total">총 ${totalPass+totalFail}개</span>
    <span class="badge pass">✓ ${totalPass}개 통과</span>
    ${totalFail > 0 ? `<span class="badge fail">✗ ${totalFail}개 실패</span>` : '<span class="badge pass">전체 통과 🎉</span>'}`;
}
window.addEventListener('load', runAndRender);
</script>
</body>
</html>
